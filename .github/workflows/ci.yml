name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Deploy runs this as its quality gate before publishing an image.
  workflow_call:
    inputs:
      skip-image-build:
        description: The caller builds and pushes the image itself.
        type: boolean
        default: false

concurrency:
  # github.workflow is the CALLER's name when Deploy runs this, so the two runs
  # of one push land in different groups and can't cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Vitest runs through npx on purpose -- see TESTING.md.
      - run: npm test
      # Needs no env: the backend address is read when the server runs.
      - run: npm run build

  docker:
    name: Production image builds
    # A negation on purpose: on push and pull_request `inputs` is empty, and
    # GitHub compares null == false as true, so `inputs.x != false` would skip it.
    if: ${{ !inputs.skip-image-build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cashfo-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
